name: Validate payroll
on:
  pull_request:
    paths:
      - 'dist/payroll.*'
      - 'dist/production.js'
      - 'supabase/functions/payroll-email-dispatch/**'
      - 'supabase/functions/_shared/payroll-email-pdf.mjs'
      - 'supabase/functions/_shared/payroll-fonts.mjs'
      - 'supabase/functions/_shared/document-pdf.js'
      - 'supabase/migrations/*_payroll_email*.sql'
      - 'validation/payroll*'
      - '.github/workflows/validate-payroll.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  payroll:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Verify payroll email queue and PDF against isolated fixtures
        run: |
          npm install --prefix "$RUNNER_TEMP/cage-payroll-email" --no-save --ignore-scripts @electric-sql/pglite@0.6.0 pdf-lib@1.17.1 @pdf-lib/fontkit@1.1.1
          CAGE_PAYROLL_TEST_MODULES="$RUNNER_TEMP/cage-payroll-email/package.json" node validation/payroll-email.mjs
      - name: Install isolated browser test dependency
        run: |
          npm install --prefix "$RUNNER_TEMP/cage-payroll-browser" --no-save --ignore-scripts playwright@1.51.1
          echo "CAGE_PLAYWRIGHT_PATH=$RUNNER_TEMP/cage-payroll-browser/node_modules/playwright" >> "$GITHUB_ENV"
          echo "CAGE_PAYROLL_QA_DIR=$RUNNER_TEMP/cage-payroll-qa" >> "$GITHUB_ENV"
      - name: Install Chromium
        run: node "$CAGE_PLAYWRIGHT_PATH/cli.js" install --with-deps chromium
      - name: Verify payroll forms and payslips
        run: node validation/payroll.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: payroll-screen-checks
          path: ${{ runner.temp }}/cage-payroll-qa
          if-no-files-found: ignore

name: Validate reliability
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  reliability:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Verify production build with isolated configuration
        run: npm run build
        env:
          SUPABASE_URL: https://build-fixture.supabase.co
          SUPABASE_ANON_KEY: sb_publishable_build_fixture_not_a_credential
          CAGE_ORGANIZATION_ID: 00000000-0000-4000-8000-000000000001
          APP_URL: https://hub.example.test
      - run: node validation/background-reliability.mjs
      - run: node validation/go-live-guards.mjs
      - name: Install isolated DOM and SQL test dependencies
        run: npm install --prefix "$RUNNER_TEMP/cage-reliability" --no-save --ignore-scripts jsdom@26.1.0 @electric-sql/pglite@0.3.14
      - name: Verify sign-in recovery and financial document guards
        env:
          CAGE_TEST_MODULES: ${{ runner.temp }}/cage-reliability/node_modules
        run: |
          node validation/login-recovery.mjs
          node validation/sign-in-access.mjs
          node validation/audit-reliability.mjs
          node validation/background-job-access.mjs
          node validation/enterprise.mjs
          node validation/mfa-security.mjs
          NODE_PATH="$CAGE_TEST_MODULES" node validation/careers-flow.cjs
          NODE_PATH="$CAGE_TEST_MODULES" node validation/vacancy-editor.cjs
          node validation/vacancy-api.mjs
          node validation/vacancy-schema.mjs

      - name: Audit locked dependency tree
        run: npm audit --audit-level=moderate

<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>Respond to quotation · CAGE</title><link rel="stylesheet" href="quote-response.css"><script src="runtime-config.js" defer></script><script src="quote-response.js" defer></script><link rel="icon" type="image/png" href="./cage-browser-logo.png?v=20260924-staff">
</head><body><main><img src="cage-logo-new.png" alt="CAGE" width="150"><h1>Your quotation</h1><p id="loading" role="status">Opening your quotation…</p><p id="error" role="alert" hidden></p><section id="details" hidden><h2 id="number"></h2><p id="client"></p><p id="description"></p><p id="amount"></p><p id="valid"></p><a id="pdf" download>Download the exact quotation PDF</a><p id="approver"></p><form id="response-form"><label>Your full name<input name="name" required minlength="2" maxlength="120" autocomplete="name"></label><label>Your response<select name="action" required><option value="">Choose a response</option><option value="Accepted">Accept quote</option><option value="Changes requested">Request changes</option><option value="Declined">Decline quote</option></select></label><label>Message to CAGE<textarea name="note" maxlength="3000" rows="4"></textarea><small>Required when requesting changes.</small></label><label class="confirmation"><input name="authorised" type="checkbox" required> I am the intended recipient and authorised to respond on behalf of this client. I have reviewed the quotation PDF.</label><p>Your choice will be recorded with your name, designated email address and the time. Once submitted, contact CAGE to discuss any further changes.</p><button type="submit">Submit response</button></form></section><section id="success" role="status" hidden></section><p class="footer">CAGE · Keep this private link confidential.</p></main></body></html>
